[project]
# Имя «orbit» на PyPI уже занято чужим пакетом: без приставки
# «pip install orbit» поставил бы не этот проект.
name = "uniqore-orbit"
version = "0.1.0"
description = "UniqOre Orbit: все системы студии под одним телеграм-ботом"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "typer>=0.12",
    "anthropic>=0.40",
    "pandas>=2.2",
    "openpyxl>=3.1",
    # Проверка домена перед отправкой: письмо на мёртвый домен возвращается
    # ошибкой, а десяток возвратов подряд роняет доверие ко всему нашему домену.
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

# Вкладка «Фриланс» читает базу биржи напрямую, то есть Orbit зависит от
# соседнего проекта. В зависимостях его нет и быть не может: это не пакет с
# PyPI, а каталог рядом. Ставится вручную, в ту же .venv:
#
#     .venv/bin/pip install -e ../freelance-bid
#
# Без этого Orbit работает, но вкладка «Фриланс» честно говорит, что проект
# есть на диске и не установлен, — а не изображает, что заказов нет.

[project.scripts]
orbit = "orbit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = [
    "SIM108",  # тернарник вместо if не всегда читаемее
    "B008",    # typer.Option в аргументах по умолчанию — это его штатный способ
]

[tool.pytest.ini_options]
testpaths = ["tests"]
