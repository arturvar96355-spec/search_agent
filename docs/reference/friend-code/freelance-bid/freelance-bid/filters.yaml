# Фильтры отбора заказов. Правь этот файл — перезапуск софта не нужен,
# он перечитывает файл на каждом проходе.
#
# Проверить, что получится, не отправляя откликов:
#   .venv/bin/python -m fbid.cli filter-check
#
# ВАЖНО ПРО ДЕНЬГИ: потолки трат из .env (PROFI_MAX_BID_PRICE, PROFI_DAILY_BUDGET)
# главнее этого файла. Здесь лимит можно только УЖЕСТОЧИТЬ, поднять выше .env нельзя.

common:
  # Не откликаться на заказы старше N часов: там уже десятки откликов.
  max_age_hours: 24

  # Брать ли заказы без указанного бюджета («по договорённости»).
  # true, но не «пропускаем как раньше»: по таким заказам модель сама оценивает
  # стоимость работы по ТЗ, и эта оценка проверяется тем же порогом min_budget.
  # Заказ без суммы, который мы оцениваем в 8 000 ₽, отсеется так же, как
  # заказ с явными 8 000 ₽.
  allow_negotiable: true

  # Минимальный бюджет, ₽. null = не резать по бюджету.
  # Применяется и к указанному бюджету, и к нашей оценке работы по договорным.
  min_budget: 20000

  # Максимальный бюджет, ₽. null = не резать сверху.
  # Крупная сумма означает не «много денег нам», а тендер: заказчик собирает
  # предложения от студий с профильным портфолио, отделом продаж и юристами.
  # Отклик там уходит в никуда, а на Profi.ru ещё и стоит дороже всего —
  # цена контакта растёт вместе с бюджетом заказа.
  max_budget: 170000

  # Если хоть одно слово встретилось — заказ отбрасываем.
  stop_words:
    # Наём в штат: это не заказ, откликаться нельзя
    - вакансия
    - ваканси
    - в штат
    - в команду на постоянной
    - на постоянную основу
    - постоянная работа
    - полная занятость
    - частичная занятость
    - неполная занятость
    - полный рабочий день
    - график работы
    - оформление по тк
    - трудовой договор
    - трудоустройство
    - испытательный срок
    - оклад
    - зарплата
    - з/п
    - зп от
    - ищем сотрудника
    - ищем специалиста в команду
    - ищем разработчика в команду
    - требуется сотрудник
    - в нашу команду
    - фултайм
    - full-time
    - fulltime
    - соискател
    - резюме
    - собеседование
    - курсовая
    - дипломная
    - реферат
    - контрольная работа
    - за отзыв
    - бесплатно
    - тестовое задание бесплатно
    - только физлицо
    - ищем сотрудника
    # Контент и SMM. Эти слова в заказе на разработку не встречаются вообще,
    # поэтому ловим их где угодно в тексте, а не только в заголовке. Повод:
    # 06.08.2026 «Создание сторителлингов для прогревов» прошло фильтры и
    # набрало 7.0 из 10 — прошло по слову «сайт» из строки «Платформа сайта».
