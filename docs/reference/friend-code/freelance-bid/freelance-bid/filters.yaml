fl:
  enabled: true
  # Разделы FL.ru. Можно указать верхний раздел («Программирование») —
  # тогда подходят все его подкатегории. Список снят с живой ленты.
  categories_allow:
    - Программирование
    - Сайты
    - Мессенджеры
    - Игры
    - AI — искусственный интеллект
    - Автоматизация бизнеса
    - Социальные сети / Telegram
    - Мобильные приложения
    - Базы данных
    - Хостинг
    - Серверы
    - Тестирование
  # Чёрный список сильнее ключевых слов: эти разделы не пройдут никогда.
  # Собран по реальной ленте — именно оттуда лезли логотипы, таргет и SEO.
  categories_deny:
    - Сайты / Контент-менеджер
    - Социальные сети / SMM-дизайнер
    - Дизайн
    - Рисунки и иллюстрации
    - 3D Графика
    - Аудио
    - Реклама и Маркетинг
    - Продвижение сайтов (SEO, GEO)
    - Инжиниринг
    - Маркетплейс менеджмент
    - Тексты и переводы
    - Аутсорсинг и консалтинг
    # Разработку игр берём, а «поиграть за клиента» и тестирование прохождением —
    # нет. Это разные разделы, и в чёрный список идёт только второй.
    - Игры / Тестирование игр
    - Игры / Прокачка персонажей
    - Игры / Игровые предметы
  # Категория не подошла, но есть ключевое слово из keywords_any — брать заказ?
  # true — ловим заказы, засунутые заказчиком не в тот раздел (их много).
  allow_by_keywords: true

profi:
  enabled: true
  # На Profi категория — это название услуги из анкеты, а не жёсткий справочник,
  # поэтому здесь работаем в основном по ключевым словам.
  categories_allow:
    - Программист
    - Программисты
    - Айтишник
    - Веб-разработка
    - Веб-разработчик
    - Разработка
    - Разработчик
    - Создание сайтов
    - Сайт
    - Настройка CRM
    - Верстальщик
    - Frontend
    - Backend
    - DevOps
    - Системный администратор
    - Базы данных
    - Тестировщик
    - Автоматизация
  # Отсечки. Разрешающий список работает по НАЧАЛУ слова, и «Разработка»
  # выше протаскивает всё, что начинается на это слово: «Разработка игр на
  # Unreal Engine», «Разработка приложений дополненной реальности». Проверено
  # деньгами 24-25.08.2026: три таких отклика ушли и стоили 700 ₽ при том,
  # что мы этого не делаем. Запрет сильнее разрешения, поэтому чиним здесь,
  # не ломая остальной список.
  categories_deny:
    - Разработка игр
    - Разработка компьютерных игр
    - Разработка мобильных игр
    - Разработка приложений дополненной реальности
    - Разработка VR
    - 3D-моделирование
    - 3Д-моделирование
    - 3D-визуализация
    - 3Д-визуализация
    - Рендер
    - Моделирование
    - Анимация
    - Motion-дизайн
    - Видеомонтаж
    - Дизайнер
    - Иллюстратор
  allow_by_keywords: true

  # «Возможно, вакансия» — это найм в штат, а не разовый заказ.
  skip_vacancies: true

  # Потолок цены отклика. Основной критерий — доля от бюджета заказа (max_bid_pct),
  # потому что Profi берёт тем больше, чем дороже заказ. Абсолютный потолок и
  # процент берутся из .env; здесь их можно только ужесточить.
  # max_bid_price: 300   # раскомментировать, чтобы поставить жёсткий рублёвый потолок
  # max_bid_pct: 1.5     # раскомментировать, чтобы платить не больше 1.5% от бюджета

  # Не откликаться, если мы будем N-ми или дальше по рейтингу (null = не проверять).
  max_bid_rank: null

  # Требовать подтверждённый телефон заказчика.
  require_phone_confirmed: false

youdo:
  enabled: true
  # На Юду категорию заданию ставит сам заказчик, и в списке её не видно —
  # отбор идёт по ключевым словам из common.
  categories_allow: []
  categories_deny: []
  allow_by_keywords: true

  # Половина доски Юду — курьеры, уборка и «приехать по адресу». Берём только
  # то, что помечено «Можно выполнить удаленно».
  require_remote: true
