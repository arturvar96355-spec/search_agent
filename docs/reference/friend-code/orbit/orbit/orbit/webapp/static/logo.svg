<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <!--
    Знак чёрно-белый намеренно: цвет здесь ничего не сообщает, а в интерфейсе,
    где важны состояния (зелёное — работает, красное — встало), фирменный цвет
    отнимал бы у них внимание. Всё рисуется currentColor, поэтому знак сам
    подхватывает цвет текста и одинаково читается на светлом и на тёмном.

    Порядок отрисовки и есть весь фокус. Кольцо рисуется ДВАЖДЫ: сначала
    целиком — оно уходит за планету, потом его ближняя половина поверх неё.
    Без второго прохода получается не планета с кольцом, а схема атома:
    шарик, вокруг которого болтаются овалы.
  -->
  <defs>
    <!-- Ближняя половина кольца: всё, что ниже центра в повёрнутой системе -->
    <clipPath id="front"><rect x="0" y="120" width="240" height="120"/></clipPath>
  </defs>

  <!-- Дальняя орбита спутника: тусклее, чтобы не спорила с кольцом -->
  <ellipse cx="120" cy="120" rx="102" ry="34" transform="rotate(-28 120 120)"
           fill="none" stroke="currentColor" stroke-width="2.5" opacity=".28"/>

  <!-- Кольцо целиком — задняя часть -->
  <g transform="rotate(20 120 120)">
    <ellipse cx="120" cy="120" rx="106" ry="36" fill="none"
             stroke="currentColor" stroke-width="5"/>
  </g>

  <!-- Планета -->
  <circle cx="120" cy="120" r="47" fill="currentColor"/>

  <!-- Кольцо, ближняя половина — поверх планеты -->
  <g transform="rotate(20 120 120)" clip-path="url(#front)">
    <ellipse cx="120" cy="120" rx="106" ry="36" fill="none"
             stroke="currentColor" stroke-width="5"/>
  </g>

  <!-- Спутник на дальней орбите: он и задаёт направление движения -->
  <circle cx="211" cy="77" r="10" fill="currentColor"/>
  <circle cx="29" cy="163" r="6" fill="currentColor" opacity=".5"/>
</svg>
